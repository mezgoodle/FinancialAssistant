[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financialassistant"
version = "0.1.0"
description = "Financial Assistant AI powered by Google ADK 2.0 and Supabase"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=2.19.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "supabase>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
